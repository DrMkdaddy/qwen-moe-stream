name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy gguf
      - name: Expert partition algebra
        run: python tests/test_expert_math.py
      - name: Manifest offsets (skips without a converted model)
        run: python tests/test_manifest_offsets.py
